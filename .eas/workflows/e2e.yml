name: e2e tests and AI review

on:
  pull_request:
    branches: ['main']
    types: ['opened', 'reopened', 'synchronize', 'ready_for_review']
    if: ${{ !github.event.pull_request.draft }}

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel_in_progress: true

defaults:
  tools:
    node: '24'

jobs:
  # Reuse the last iOS Simulator build with the same native code. Repack puts this PR's
  # JavaScript into it. Build from scratch only when the native code changed.
  fingerprint:
    type: fingerprint
    environment: preview

  get_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      platform: ios
      profile: e2e

  repack:
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: e2e

  # The PR comment: e2e's test report, then before and after images of each changed screen.
  tests:
    name: Run the e2e suite and compare screens
    needs: [get_build]
    after: [build, repack]
    environment: preview
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_IOS_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      BASELINE_URL: https://channel-surfing--e2e-screens-main.expo.app
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKFLOW_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run e2e and comment on the PR
        run: |
          : "${E2E_IOS_BUILD_ID:?No build. Check the build or repack job of this run.}"
          node scripts/e2e-pr.mjs fetch-baselines
          set +e
          # The tests never get the GitHub token.
          env -u GITHUB_TOKEN npx e2e run --exclude-tag screens --reporter list,markdown
          status=$?
          # A changed screen is evidence for the reviewer, not a failure.
          env -u GITHUB_TOKEN npx e2e run --tag screens --retries 0 --output .e2e-screens --reporter list
          set -e
          node scripts/e2e-pr.mjs evidence
          if ls .e2e-evidence/*.png > /dev/null 2>&1; then
            EVIDENCE_URL=$(npx --yes eas-cli@latest deploy --export-dir .e2e-evidence --json --non-interactive \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).url))')
            export EVIDENCE_URL
          fi
          node scripts/e2e-pr.mjs comment
          exit $status
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-tests
          path: |
            .e2e
            .e2e-screens

  # The PR review: an agent reads the diff, uses the app, and reports findings.
  review:
    name: AI review of the change
    needs: [get_build]
    after: [build, repack]
    environment: preview
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_IOS_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKFLOW_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Fetch the base branch
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --no-tags --unshallow origin; fi
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Explore the change and post a review
        run: |
          : "${E2E_IOS_BUILD_ID:?No build. Check the build or repack job of this run.}"
          set +e
          # The agent reads the diff and drives the app. It never gets the GitHub token.
          env -u GITHUB_TOKEN npx e2e explore --changed-since "origin/$BASE_REF" --max-steps 6 \
            --output .e2e-review --reporter list --video on
          status=$?
          set -e
          node scripts/e2e-pr.mjs evidence
          if ls .e2e-evidence/*.png > /dev/null 2>&1; then
            EVIDENCE_URL=$(npx --yes eas-cli@latest deploy --export-dir .e2e-evidence --json --non-interactive \
              | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s).url))')
            export EVIDENCE_URL
          fi
          node scripts/e2e-pr.mjs review
          # Findings are a review aid, not a merge gate. Fail only on config, device, or model errors.
          if [ "$status" -gt 1 ]; then exit $status; fi
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-review
          path: .e2e-review

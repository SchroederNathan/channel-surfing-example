name: e2e tests and AI review

on:
  pull_request:
    branches: ['main']
    types: ['opened', 'reopened', 'synchronize', 'ready_for_review']
    if: ${{ !github.event.pull_request.draft }}

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel_in_progress: true

defaults:
  tools:
    node: '24'

jobs:
  # Reuse the last iOS Simulator build with the same native code. Repack puts this PR's
  # JavaScript into it. Build from scratch only when the native code changed.
  fingerprint:
    type: fingerprint
    environment: preview

  get_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      platform: ios
      profile: e2e

  repack:
    type: repack
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: e2e

  tests:
    name: Run the e2e suite on Expo Simulators
    needs: [get_build]
    after: [build, repack]
    environment: preview
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_IOS_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: run
        name: Run e2e
        run: |
          : "${E2E_IOS_BUILD_ID:?No build. Check the build or repack job of this run.}"
          set +e
          env -u GITHUB_TOKEN npx e2e run --reporter list,markdown
          status=$?
          set -e
          if [ -s .e2e/summary.md ]; then
            set-output summary "$(head -c 60000 .e2e/summary.md)"
          else
            set-output summary "### 🔴 e2e did not write a summary (exit code $status)"
          fi
          exit $status
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-tests
          path: .e2e

  comment:
    name: Comment the test results
    type: github-comment
    after: [tests]
    params:
      payload: |
        ${{ after.tests.outputs.summary || '### 🔴 e2e: the test job did not finish' }}

        [Workflow run, screenshots, and logs](${{ workflow.url }})

  review:
    name: AI review of the change on Expo Simulators
    needs: [get_build]
    after: [build, repack]
    environment: preview
    env:
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_IOS_BUILD_ID: ${{ after.build.outputs.build_id || after.repack.outputs.build_id }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKFLOW_URL: ${{ workflow.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Fetch the base branch
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --no-tags --unshallow origin; fi
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Explore the change and post a review
        run: |
          : "${E2E_IOS_BUILD_ID:?No build. Check the build or repack job of this run.}"
          set +e
          # The agent reads the diff and drives the app. It never gets the GitHub token.
          env -u GITHUB_TOKEN npx e2e explore --changed-since "origin/$BASE_REF" --max-steps 6 \
            --output .e2e-review --reporter list,markdown --video on
          status=$?
          set -e
          node scripts/post-pr-review.mjs .e2e-review
          # Findings are a review aid, not a merge gate. Fail only on config, device, or model errors.
          if [ "$status" -gt 1 ]; then exit $status; fi
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-review
          path: .e2e-review
